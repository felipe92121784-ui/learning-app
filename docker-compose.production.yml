x-api-environment: &api-environment
  NODE_ENV: production
  TZ: ${TZ:-UTC}
  PORT: ${PORT:-3333}
  HOST: ${HOST:-0.0.0.0}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_KEY: ${APP_KEY:?APP_KEY must be set}
  APP_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL must be set}
  ADMIN_NAME: ${ADMIN_NAME:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  DB_HOST: postgres
  DB_PORT: ${DB_PORT:-5432}
  DB_USER: ${DB_USER:?DB_USER must be set}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
  DB_DATABASE: ${DB_DATABASE:?DB_DATABASE must be set}
  CORS_ORIGIN: ${APP_PUBLIC_URL:?APP_PUBLIC_URL must be set}
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
  S3_BUCKET: ${S3_BUCKET:-ideal-learning}
  S3_REGION: ${S3_REGION:-us-east-1}
  IMAGE_TILE_THRESHOLD_PX: ${IMAGE_TILE_THRESHOLD_PX:-4096}
  IMAGE_TILE_SIZE: ${IMAGE_TILE_SIZE:-256}
  SESSION_DRIVER: ${SESSION_DRIVER:-cookie}

services:
  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL must be set}/api/v1
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
      - edge

  api:
    image: ideal-learning-api:production
    build:
      context: ./api
    restart: unless-stopped
    environment: *api-environment
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3333/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal

  worker:
    image: ideal-learning-api:production
    command: node ace process:material-jobs
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE must be set}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

volumes:
  postgres_data:
  minio_data:

networks:
  internal:
    internal: true
  # Public edge network: only the web/Caddy container joins it so Docker can
  # publish its host port. Docker refuses to publish ports for a container
  # attached solely to an "internal: true" network.
  edge:
    driver: bridge
